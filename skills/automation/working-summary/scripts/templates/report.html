<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>$title</title>
<style>
  :root {
    --bg: #0b0f14;
    --bg-elev: #0f141b;
    --bg-hover: #151c26;
    --fg: #c9d1d9;
    --fg-dim: #8b98a5;
    --fg-faint: #4e5966;
    --accent: #7ee787;
    --accent-feat: #79c0ff;
    --accent-fix: #ffa657;
    --accent-refactor: #d2a8ff;
    --accent-ci: #8b98a5;
    --accent-perf: #ff7b72;
    --accent-docs: #a5d6ff;
    --accent-warn: #f78166;
    --border: #21262d;
    --border-strong: #30363d;
    --cursor: #7ee787;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fbfbf8;
      --bg-elev: #f4f3ee;
      --bg-hover: #ecebe3;
      --fg: #1a1a1a;
      --fg-dim: #4a4a4a;
      --fg-faint: #8a8a8a;
      --accent: #2f7a36;
      --accent-feat: #0b62d1;
      --accent-fix: #b85c00;
      --accent-refactor: #7c3aed;
      --accent-ci: #4a4a4a;
      --accent-perf: #c23a2b;
      --accent-docs: #0b4da0;
      --accent-warn: #b33a1b;
      --border: #d8d6ce;
      --border-strong: #b8b6ac;
      --cursor: #2f7a36;
    }
  }
  @media print {
    :root {
      --bg: #ffffff; --bg-elev: #ffffff; --bg-hover: #ffffff;
      --fg: #000; --fg-dim: #333; --fg-faint: #666;
      --accent: #1f5f26; --accent-feat: #0b4da0; --accent-fix: #8a4500;
      --accent-refactor: #5a1fb0; --accent-ci: #333; --accent-perf: #8a1e14;
      --accent-docs: #0b4da0; --accent-warn: #8a2a10;
      --border: #ccc; --border-strong: #888;
    }
    body { font-size: 10pt; }
    aside, .toolbar, .copy-btn, .print-hide { display: none !important; }
    main { margin: 0 !important; padding: 0 !important; max-width: none !important; }
    details { break-inside: avoid; }
    details > summary { cursor: default; list-style: none; }
    details:not([open]) { display: block; }
    details:not([open]) > *:not(summary) { display: revert !important; }
    a { color: inherit; text-decoration: none; }
    a::after { content: " (" attr(href) ")"; font-size: 0.85em; color: #666; }
    .typewriter { animation: none !important; border-right: none !important; white-space: normal !important; max-width: none !important; }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent-feat); text-decoration: none; border-bottom: 1px dotted var(--accent-feat); word-break: break-word; }
  a:hover { background: var(--bg-hover); }
  code {
    color: var(--fg-dim);
    background: var(--bg-elev);
    padding: 0 4px;
    border-radius: 2px;
    font-size: 0.92em;
  }
  p { margin: 0.6em 0; }
  ul { padding-left: 20px; }
  li { margin: 6px 0; }
  hr { border: none; border-top: 1px dashed var(--border); margin: 24px 0; }
  strong { color: var(--fg); }

  .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  aside {
    position: sticky; top: 0; align-self: start;
    height: 100vh; overflow-y: auto;
    border-right: 1px solid var(--border);
    padding: 24px 16px;
    background: var(--bg-elev);
  }
  main { padding: 32px 48px 96px; max-width: 960px; min-width: 0; }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
    main { padding: 24px; }
  }

  .brand { font-size: 11px; color: var(--fg-faint); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 18px; }
  .toc { list-style: none; padding: 0; margin: 0; }
  .toc li { margin: 4px 0; }
  .toc a {
    display: block; padding: 5px 8px;
    color: var(--fg-dim); border-bottom: none;
    border-left: 2px solid transparent;
    font-size: 12px;
  }
  .toc a:hover { color: var(--fg); background: var(--bg-hover); border-left-color: var(--border-strong); }
  .toc a.active { color: var(--accent); border-left-color: var(--accent); }
  .toc .sub a { padding-left: 20px; font-size: 11px; color: var(--fg-faint); }

  .prompt-line { color: var(--fg-faint); font-size: 12px; margin-bottom: 6px; word-break: break-all; }
  .prompt-line .user { color: var(--accent); }
  .prompt-line .host { color: var(--accent-feat); }

  h1.report-title { font-size: 22px; font-weight: 700; margin: 0 0 4px; color: var(--fg); letter-spacing: -0.01em; }
  .typewriter {
    display: inline-block; overflow: hidden; white-space: nowrap;
    border-right: 2px solid var(--cursor); max-width: 100%;
    animation: typing 1.6s steps($type_steps, end) 0.15s 1 both, blink 0.9s step-end infinite;
  }
  @keyframes typing { from { width: 0 } to { width: 100% } }
  @keyframes blink { 50% { border-color: transparent } }

  .meta-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px 24px; margin: 18px 0 28px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: var(--bg-elev);
  }
  .meta-grid .k { font-size: 10px; color: var(--fg-faint); letter-spacing: 0.08em; text-transform: uppercase; }
  .meta-grid .v { font-size: 14px; color: var(--fg); font-weight: 600; margin-top: 2px; }
  .meta-grid .v .unit { color: var(--fg-dim); font-weight: 400; font-size: 11px; margin-left: 4px; }

  .toolbar { display: flex; gap: 8px; margin: 0 0 28px; align-items: center; }
  .toolbar input {
    flex: 1;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 2px;
    color: var(--fg);
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 10px 8px 28px;
    outline: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238b98a5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>");
    background-repeat: no-repeat;
    background-position: 8px center;
  }
  .toolbar input:focus { border-color: var(--accent); }
  .toolbar .hint { font-size: 11px; color: var(--fg-faint); white-space: nowrap; }

  section { margin-bottom: 40px; }
  h2 {
    font-size: 15px; color: var(--fg);
    margin: 0 0 14px; padding: 0 0 6px;
    border-bottom: 1px dashed var(--border);
    font-weight: 700;
  }
  h2::before { content: "## "; color: var(--fg-faint); font-weight: 400; }
  h3 { font-size: 13px; color: var(--accent); margin: 18px 0 8px; font-weight: 600; }
  h3::before { content: "### "; color: var(--fg-faint); font-weight: 400; }
  h4 { font-size: 12px; color: var(--fg); margin: 14px 0 6px; font-weight: 600; }
  h4::before { content: "› "; color: var(--fg-faint); }

  details {
    border: 1px solid var(--border);
    border-radius: 2px;
    margin: 10px 0;
    background: var(--bg-elev);
  }
  details > summary {
    cursor: pointer; padding: 10px 14px; list-style: none;
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; color: var(--fg); user-select: none;
  }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before {
    content: "▸"; color: var(--fg-dim); font-size: 10px;
    transition: transform 0.15s;
    display: inline-block;
  }
  details[open] > summary::before { transform: rotate(90deg); }
  details > summary:hover { background: var(--bg-hover); }
  details > summary .count { margin-left: auto; color: var(--fg-faint); font-weight: 400; font-size: 11px; }
  details > .details-body { padding: 4px 16px 14px 30px; }
  details > .details-body > ul:first-child { margin-top: 6px; }

  /* List-item entries (main content) */
  .content ul { list-style: none; padding-left: 0; }
  .content li {
    position: relative;
    padding: 6px 0 6px 0;
    border-bottom: 1px dashed var(--border);
  }
  .content li:last-child { border-bottom: none; }
  .content li .tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 1px 6px;
    border-radius: 2px;
    font-weight: 700;
    text-transform: uppercase;
    color: #0b0f14;
    margin-right: 8px;
    vertical-align: 1px;
  }
  @media (prefers-color-scheme: light) { .content li .tag { color: #fff; } }
  @media print { .content li .tag { color: #fff !important; } }
  .content li .tag.feat { background: var(--accent-feat); }
  .content li .tag.fix { background: var(--accent-fix); }
  .content li .tag.refactor { background: var(--accent-refactor); }
  .content li .tag.ci,
  .content li .tag.build,
  .content li .tag.chore { background: var(--accent-ci); }
  .content li .tag.perf { background: var(--accent-perf); }
  .content li .tag.docs,
  .content li .tag.test { background: var(--accent-docs); }

  .stats {
    font-family: var(--mono); font-size: 12px;
    padding: 12px 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    margin: 14px 0; border-radius: 2px;
    overflow-x: auto;
  }
  .stats .row {
    display: grid;
    grid-template-columns: minmax(160px, 200px) 1fr 56px;
    gap: 10px; padding: 3px 0; align-items: center;
  }
  .stats .row .name { color: var(--fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stats .row .bar { color: var(--accent); letter-spacing: -1px; white-space: pre; }
  .stats .row .num { color: var(--fg); text-align: right; font-variant-numeric: tabular-nums; }

  .callout {
    border-left: 3px solid var(--accent);
    padding: 10px 14px; margin: 14px 0;
    background: var(--bg-elev);
    font-size: 12.5px;
  }
  .callout.warn, .callout.warning { border-left-color: var(--accent-warn); }
  .callout.info { border-left-color: var(--accent-feat); }
  .callout.success { border-left-color: var(--accent); }
  .callout > .label {
    display: block; font-weight: 700;
    color: var(--accent); font-size: 10px;
    letter-spacing: 0.1em; text-transform: uppercase;
    margin-bottom: 4px;
  }
  .callout.warn > .label, .callout.warning > .label { color: var(--accent-warn); }
  .callout.info > .label { color: var(--accent-feat); }
  .callout > p:first-of-type { margin-top: 0; }
  .callout > p:last-child { margin-bottom: 0; }

  .copy-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg-dim);
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 6px;
    cursor: pointer;
    border-radius: 2px;
  }
  .copy-btn:hover { color: var(--fg); border-color: var(--border-strong); background: var(--bg-hover); }
  .copy-btn.done { color: var(--accent); border-color: var(--accent); }

  .content li.hidden, .content section.hidden { display: none; }
  mark { background: var(--accent); color: var(--bg); padding: 0 2px; }
</style>
</head>
<body>

<div class="layout">
  <aside>
    <div class="brand">WORKING-SUMMARY</div>
    <ul class="toc">
      $toc
    </ul>
  </aside>

  <main>
    <div class="prompt-line">$prompt_line</div>
    <h1 class="report-title"><span class="typewriter">$report_title</span></h1>

    $meta_grid

    <div class="toolbar print-hide">
      <input type="search" id="filter" placeholder="过滤条目（按标题、仓库、编号）…" />
      <span class="hint">⌘K / Ctrl+K</span>
    </div>

    <div class="content">
      $body
    </div>

    $stats
  </main>
</div>

<script>
  const filter = document.getElementById('filter');
  const items = Array.from(document.querySelectorAll('.content li'));
  filter?.addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    items.forEach(el => {
      if (!q) { el.classList.remove('hidden'); return; }
      const txt = el.textContent.toLowerCase();
      el.classList.toggle('hidden', !txt.includes(q));
    });
  });
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      filter?.focus();
    }
  });

  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', async (ev) => {
      ev.preventDefault();
      const target = btn.closest('details') || btn.closest('section');
      const text = target?.innerText || '';
      try {
        await navigator.clipboard.writeText(text);
        btn.classList.add('done');
        const old = btn.textContent;
        btn.textContent = '✓';
        setTimeout(() => { btn.classList.remove('done'); btn.textContent = old; }, 1200);
      } catch {}
    });
  });

  const links = document.querySelectorAll('.toc a');
  const secs = Array.from(document.querySelectorAll('section[id]'));
  const onScroll = () => {
    const y = window.scrollY + 140;
    let current = secs[0]?.id;
    for (const s of secs) { if (s.offsetTop <= y) current = s.id; }
    links.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + current));
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
</script>

</body>
</html>
